name: CI - Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Check (desktop)
        run: cargo check -p aether-core -p aether-audio -p aether-ui -p aether-desktop

      - name: Run Cargo Test (core crates)
        run: cargo test -p aether-core -p aether-audio -p aether-ui -p aether-cache -p aether-monitor

      - name: Build Release Binary
        run: cargo build --release -p aether-desktop

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: just-music-windows-x64
          path: target/release/just-music.exe
          if-no-files-found: error
