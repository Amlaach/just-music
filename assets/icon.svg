<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#8A2387" />
    </linearGradient>
    <linearGradient id="note" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E0E0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bg)" filter="url(#shadow)" />

  <!-- Dynamic Soundwave Circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="6" />

  <!-- Modern Music Note with Soundwave Bars -->
  <g fill="url(#note)" filter="url(#shadow)">
    <!-- Left Note Head -->
    <ellipse cx="176" cy="336" rx="44" ry="34" transform="rotate(-15 176 336)" />
    <!-- Right Note Head -->
    <ellipse cx="326" cy="286" rx="44" ry="34" transform="rotate(-15 326 286)" />

    <!-- Left Stem -->
    <rect x="204" y="140" width="16" height="190" rx="8" />
    <!-- Right Stem -->
    <rect x="354" y="90" width="16" height="190" rx="8" />

    <!-- Connecting Beam -->
    <path d="M 204 140 L 370 90 L 370 130 L 204 180 Z" />
  </g>

  <!-- Equalizer Pulse Bars -->
  <g fill="#FFFFFF" opacity="0.85">
    <rect x="110" y="240" width="8" height="40" rx="4" />
    <rect x="126" y="220" width="8" height="80" rx="4" />
    <rect x="142" y="250" width="8" height="30" rx="4" />
    
    <rect x="370" y="230" width="8" height="60" rx="4" />
    <rect x="386" y="210" width="8" height="90" rx="4" />
    <rect x="402" y="245" width="8" height="40" rx="4" />
  </g>
</svg>
