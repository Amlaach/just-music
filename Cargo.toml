[workspace]
resolver = "2"
members = [
    "crates/aether-core",
    "crates/aether-audio",
    "crates/aether-storage",
    "crates/aether-library",
    "crates/aether-cache",
    "crates/aether-provider",
    "crates/aether-plugin",
    "crates/aether-monitor",
    "crates/aether-ui",
    "crates/aether-desktop",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Amlaach <https://github.com/Amlaach>"]
license = "MIT"

[patch.crates-io]
getrandom = { path = "crates/getrandom-patch" }

[workspace.dependencies]
# Async & Concurrency
tokio = { version = "1.38", features = ["full"] }
crossbeam-channel = "0.5"
futures = "0.3"
rtrb = "0.3"

# Audio Stack
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.15"

# Database & Search
rusqlite = { version = "0.31", features = ["bundled"] }
libsqlite3-sys = { version = "0.28", features = ["bundled-windows"] }

# Plugin Runtime
wasmtime = { version = "21.0", default-features = false, features = ["async", "cranelift", "runtime", "std"] }

# GUI Stack
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.28"
egui_extras = { version = "0.28", default-features = false }
rfd = "0.14"

# Utilities & Error Handling
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4.38", default-features = false, features = ["serde", "clock", "std"] }

# Internal workspace crates
aether-core = { path = "crates/aether-core" }
aether-audio = { path = "crates/aether-audio" }
aether-storage = { path = "crates/aether-storage" }
aether-library = { path = "crates/aether-library" }
aether-cache = { path = "crates/aether-cache" }
aether-provider = { path = "crates/aether-provider" }
aether-plugin = { path = "crates/aether-plugin" }
aether-monitor = { path = "crates/aether-monitor" }
aether-ui = { path = "crates/aether-ui" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
